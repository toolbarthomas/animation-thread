<!doctype html>
<html>

<head>
  <title>requestAnimationThread</title>

  <style>
    body {
      background: #4d4d4d;
    }

    .block {
      width: 100px;
      height: 100px;
      border: solid 6px white;
      background-color: beige;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 300%;
    }
  </style>

  <script type="module">
    import { requestAnimationThread } from "./index.js";

    function create(fps, strict)
    {

      const element = document.createElement('div');
      element.classList.add('block');
      element.innerText = fps;
      document.body.append(element);
      let value = 0;
      let paused = false;
      let sum = 0;


      const pause = document.createElement('button')
      pause.innerText = "Pause";
      pause.onclick = () =>
      {
        element.innerText = 0
        thread.pause()
      };
      const resume = document.createElement('button')
      resume.innerText = "Resume";
      resume.onclick = () => thread.resume(fps);

      const fpsInfo = document.createElement('button')
      fpsInfo.innerText = "FPS";
      fpsInfo.onclick = () => console.log(thread.fps());

      const intervalInfo = document.createElement('button')
      intervalInfo.innerText = "Interval";
      intervalInfo.onclick = () => console.log(thread.interval());

      const x5 = document.createElement('button')
      x5.innerText = "5";
      x5.onclick = () => console.log(thread.throttle(5));

      const x10 = document.createElement('button')
      x10.innerText = "10";
      x10.onclick = () => console.log(thread.throttle(10));

      const x30 = document.createElement('button')
      x30.innerText = "30";
      x30.onclick = () => console.log(thread.throttle(30));

      const x60 = document.createElement('button')
      x60.innerText = "60";
      x60.onclick = () => console.log(thread.throttle(60));

      const x90 = document.createElement('button')
      x90.innerText = "90";
      x90.onclick = () => console.log(thread.throttle(90));

      document.body.appendChild(pause);
      document.body.appendChild(resume);
      document.body.appendChild(fpsInfo);
      document.body.appendChild(intervalInfo);
      document.body.appendChild(x5);
      document.body.appendChild(x10);
      document.body.appendChild(x30);
      document.body.appendChild(x60);
      document.body.appendChild(x90);

      const thread = requestAnimationThread((response) =>
      {
        const length = 2;
        element.innerText = thread.fps()
        const n = Math.round(response.multiplier * 100) / 100
        sum += Math.floor(length * n);

        //@TODO should resolve relative value;
        if (strict) {
          value += response.multiplier * length;
        } else {
          value += length;
        }

        element.style.marginLeft = `${value}px`;
        element.style.transform = `rotate(${value}deg)  `;
      }, fps, {
        speed: 1,
        limit: Infinity, strict
      })
    }

    create(10, true);
  </script>
</head>

<body>

</body>

</html>
